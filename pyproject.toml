[project]
name = "rag-agent-with-citations"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.39.0",
  "openai>=1.52.0",
  "qdrant-client>=1.12.0",
  "pypdf>=5.0.0",
  "fonttools>=4.57.0",
  "debugpy>=1.8.8",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.0",
  "ty>=0.0.1a16",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python = ".venv/bin/python"
