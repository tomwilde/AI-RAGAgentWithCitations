services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    ports:
      - "8501:8501"

  debug:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["debug"]
    command:
      - sh
      - -c
      - |
        uv run python -m debugpy --listen 0.0.0.0:5678 -m streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    ports:
      - "8501:8501"
      - "5678:5678"
    volumes:
      - ./app.py:/app/app.py
      - ./src:/app/src

volumes:
  qdrant_data:
